name: 🐛 Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. See error
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Version, OS, browser/runtime as relevant.
    validations:
      required: false
